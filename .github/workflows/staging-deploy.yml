name: Deploy staging

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: staging-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Build static website for GitHub Pages
        run: pnpm build
        env:
          GITHUB_PAGES: 'true'

      - name: Verify and package static website
        run: |
          test -f out/index.html
          cd out
          zip -qr ../static-site.zip .

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Create staging GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: staging-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          gh release create "$RELEASE_TAG" static-site.zip \
            --target "$GITHUB_SHA" \
            --title "Staging deployment $GITHUB_RUN_ID" \
            --prerelease \
            --notes "Manual staging deployment from $GITHUB_REF_NAME at $GITHUB_SHA."

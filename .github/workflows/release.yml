name: Create production release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag for this release (for example, v1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Build static website
        run: pnpm build

      - name: Package static website
        run: |
          test -f out/index.html
          cd out
          zip -r ../static-site.zip .

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          gh release create "$RELEASE_TAG" static-site.zip \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes
